# Temporary: runs the audit engine on a real site so its output can be checked before merging.
# Results are pushed to the audit-samples branch. Remove before merging.
name: audit-sample
on:
  push:
    branches: [audit-deep]
    paths: ["agents/audit-agent/**", ".github/workflows/audit-sample.yml"]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r agents/audit-agent/requirements.txt && python -m playwright install --with-deps chromium
      - name: Audit
        working-directory: agents/audit-agent
        run: |
          python - <<'PY'
          import audit, json
          from pathlib import Path
          sites = [("https://scaleupmediagroup.com/", "digital marketing agency")]
          for url, ind in sites:
              host = url.split("/")[2]
              out = Path("/tmp/samples") / host
              r = audit.run_audit(url, {"name": "Ahmed", "email": "test@example.com", "industry": ind, "website_url": url}, out, 15)
              print(host, r["score"], "visual error:", r["visual"].get("error"))
              for f in r["findings"]:
                  print(f["severity"], f["category"], f["id"], "|", f["title"])
          PY
      - name: Publish to audit-samples branch
        run: |
          cd /tmp/samples && git init -q && git checkout -q -b audit-samples
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "sample ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" audit-samples
